const app=document.querySelector('#app'),types=['def','char','ex','nonex'],labels=['定義','特徵','例子','非例子'],helps=['這個詞語是甚麼意思？','有甚麼重要性質或用法？','正確運用詞語的句子。','不符合詞義或用法的內容。'];let done=[];try{const d=JSON.parse(localStorage.getItem('vocab-lab-three-20261102'));if(Array.isArray(d))done=d.filter(n=>Number.isInteger(n)&&n>=0&&n<dataset.length)}catch{}let current=0,selected=null,places={},order=[],won=false;const el=id=>document.getElementById(id);function updateCount(){el('count').textContent=`${done.length}/${dataset.length}`}function menu(){updateCount();app.innerHTML=`<section class="hero"><div><div class="tag">詞義探索 · 迅速・照料・措手不及</div><h1>每個詞語，<br>都有值得探索的地方。</h1><p class="muted">跟小貓一起整理詞語卡片，探索定義、特徵與用法。<br>完成一個詞彙，就能收集一枚貓咪印章！</p><button class="primary" id="start">${done.length?'繼續探索':'開始探索'} →</button></div><div class="hero-art">${dataset[0].svg}<p>今天，一起學一個新詞語。</p></div></section><div class="row"><h2>選擇研究詞彙</h2><span class="muted">已完成 ${done.length} / ${dataset.length}</span></div><div class="progress"><span style="width:${done.length/dataset.length*100}%"></span></div><p class="muted">點選任何詞彙開始；已完成的詞彙也可以再次挑戰。</p><div class="grid">${dataset.map((d,i)=>`<button class="level" data-level="${i}"><small>研究 ${String(i+1).padStart(2,'0')}</small><strong>${d.word}</strong><small>${done.includes(i)?'✓ 已收集印章':'○ 等你來探索'} →</small></button>`).join('')}</div>`;el('start').onclick=()=>start(dataset.findIndex((_,i)=>!done.includes(i))<0?0:dataset.findIndex((_,i)=>!done.includes(i)));app.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start(+b.dataset.level))}
function start(i){current=i;places={};selected=null;won=false;order=[...dataset[i].items];for(let j=order.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[order[j],order[k]]=[order[k],order[j]]}renderGame()}
function renderGame(){const d=dataset[current];app.innerHTML=`<div class="row"><button id="menu">← 詞彙表</button><span class="tag">研究 ${current+1} / ${dataset.length}</span><button id="reset">重新排列</button></div><div class="row"><div><h1>${d.word}</h1><span class="muted">點選卡片，再按分類框的「放到這裏」。也可用滑鼠拖放。</span></div><button class="primary" id="check">檢查答案 ✓</button></div><div class="workspace"><aside class="pool" data-zone="pool"><h2>待分類卡片 <small id="remaining"></small></h2><button class="place" data-place="pool">放回待分類區 ↩</button><div class="pool-items" id="cards-pool"></div></aside><div class="board">${types.map((t,i)=>`<section class="zone" data-zone="${t}"><h3>${['📖','🔎','🌱','🧐'][i]} ${labels[i]}</h3><p>${helps[i]}</p><button class="place" data-place="${t}">放到這裏 ＋</button><div id="cards-${t}"></div></section>`).join('')}</div></div><div class="notice" id="notice" role="status" aria-live="polite">先讀一讀卡片，想想它屬於哪一類。</div><p><button id="hint">💡 分類提示</button></p>`;el('menu').onclick=menu;el('reset').onclick=()=>start(current);el('check').onclick=check;el('hint').onclick=()=>say('定義解釋意思；特徵說明性質或常見用法；例子展示正確運用；非例子包括錯誤用法或不符合詞義的內容。');app.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>move(b.dataset.place));app.querySelectorAll('[data-zone]').forEach(z=>{z.ondragover=e=>e.preventDefault();z.ondrop=e=>{e.preventDefault();const id=e.dataTransfer.getData('text/plain');if(order.some(x=>x.id===id)){selected=id;move(z.dataset.zone)}}});cards()}
function say(s){el('notice').textContent=s}function cards(){['pool',...types].forEach(t=>el('cards-'+t).replaceChildren());for(const item of order){const b=document.createElement('button');b.className='card'+(selected===item.id?' selected':'');b.textContent=item.text;b.dataset.id=item.id;b.setAttribute('aria-pressed',selected===item.id);b.draggable=true;b.onclick=()=>{selected=selected===item.id?null:item.id;cards();if(selected){app.querySelector(`[data-id="${selected}"]`).focus();say('已選取卡片，請選擇放置位置。')}};b.ondragstart=e=>{selected=item.id;e.dataTransfer.setData('text/plain',item.id)};el('cards-'+(places[item.id]||'pool')).append(b)}el('remaining').textContent=order.filter(x=>!places[x.id]).length+'/6'}function move(t){if(!selected){say('請先點選一張卡片。');return}if(t==='pool')delete places[selected];else places[selected]=t;selected=null;cards();say('已移動卡片。完成分類後，按「檢查答案」。')}
function check(){const missing=order.filter(x=>!places[x.id]).length;if(missing){say(`還有 ${missing} 張卡片未分類，試試把它們放到四個分類框。`);return}let errors=0;app.querySelectorAll('.card').forEach(b=>{const item=order.find(x=>x.id===b.dataset.id),correct=places[item.id]===item.type;b.classList.toggle('wrong',!correct);b.classList.toggle('right',correct);b.setAttribute('aria-label',`${correct?'分類正確':'請再想想'}：${item.text}`);if(!correct)errors++});if(errors){say(`有 ${errors} 張卡片需要再想想（紅框）。點選卡片後可以移到另一格。`);return}say('全部正確！你已掌握這個詞彙的四個面向。');if(!done.includes(current)){done.push(current);try{localStorage.setItem('vocab-lab-three-20261102',JSON.stringify(done))}catch{}}updateCount();if(!won){won=true;el('rewardArt').innerHTML=dataset[current].svg;el('next').textContent=current===dataset.length-1?'查看印章冊 →':'下一個詞彙 →';openFeeding()}}
function album(){app.innerHTML=`<div class="row"><h1>我的貓咪印章冊</h1><button id="home">← 詞彙表</button></div><p class="muted">已收集 ${done.length} / ${dataset.length} 枚。每一枚都是認真思考的足印。</p><div class="grid">${dataset.map((d,i)=>`<div class="stamp">${done.includes(i)?d.svg:'<div style="height:130px;display:grid;place-items:center;font-size:50px" aria-label="尚未解鎖">🔒</div>'}<h2>${d.word}</h2><button data-level="${i}">${done.includes(i)?'再次挑戰':'前往探索'}</button></div>`).join('')}</div>`;el('home').onclick=menu;app.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start(+b.dataset.level))}el('album').onclick=album;el('back').onclick=()=>{stopFeeding();el('reward').close();menu()};el('next').onclick=()=>{stopFeeding();el('reward').close();if(current===dataset.length-1)album();else start(current+1)};menu();

 el('feedStatus').textContent='小貓等緊你！點一粒貓糧試吓。';
 el('feedHearts').classList.remove('show');el('next').disabled=true;el('feedTray').replaceChildren();
 for(let i=0;i<3;i++){const b=document.createElement('button');b.className='kibble';b.textContent='🐟';b.draggable=true;b.setAttribute('aria-label','貓糧 '+(i+1)+'：餵小貓');b.dataset.grain=String(i);b.onclick=()=>feed(i);b.ondragstart=e=>{if(feedBusy||b.disabled){e.preventDefault();return}e.dataTransfer.setData('text/plain','cat-food:'+i)};el('feedTray').append(b)}
 updateFeeding();el('reward').showModal()
}
function updateFeeding(){el('feedMeter').textContent=Array.from({length:3},(_,i)=>i<feedCount?'♥':'○').join(' ');el('feedMeter').setAttribute('aria-label','已餵 '+feedCount+' 粒，共 3 粒');el('feedBowl').disabled=feedBusy||feedCount===3;el('feedTray').querySelectorAll('button').forEach(b=>b.disabled=feedBusy||b.classList.contains('eaten'))}
function meow(){if(!feedSound)return;try{feedAudio=feedAudio||new (window.AudioContext||window.webkitAudioContext)();feedAudio.resume().catch(()=>{});const o=feedAudio.createOscillator(),g=feedAudio.createGain(),t=feedAudio.currentTime;o.type='sine';o.frequency.setValueAtTime(700,t);o.frequency.exponentialRampToValueAtTime(1000,t+.1);o.frequency.exponentialRampToValueAtTime(450,t+.45);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.12,t+.06);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.connect(g);g.connect(feedAudio.destination);o.start(t);o.stop(t+.52)}catch{}}
function feed(i){
 const b=el('feedTray').querySelector('[data-grain="'+i+'"]');if(feedBusy||feedCount>=3||!el('reward').open||!b||b.classList.contains('eaten'))return;
 feedBusy=true;b.classList.add('eaten');el('feedCat').classList.add('eating');el('feedHearts').classList.remove('show');el('feedStatus').textContent='小貓行過嚟，津津有味咁食緊……';updateFeeding();meow();const session=feedSession;
 feedTimer=setTimeout(()=>{if(session!==feedSession)return;feedBusy=false;feedCount++;el('feedCat').classList.remove('eating');el('feedHearts').classList.add('show');updateFeeding();if(feedCount===3){el('rewardTitle').textContent='多謝你！喵～';el('feedStatus').textContent='小貓食飽好開心！你認真完成挑戰，真有耐性！';el('next').disabled=false;el('next').focus();meow()}else{el('feedStatus').textContent='喵～好好味！仲有 '+(3-feedCount)+' 粒貓糧。';el('feedTray').querySelector('button:not(:disabled)').focus()}},1500)
}
el('feedSound').onclick=()=>{feedSound=!feedSound;el('feedSound').textContent='聲音：'+(feedSound?'開':'關');el('feedSound').setAttribute('aria-pressed',String(feedSound));if(feedSound)meow()};
el('feedBowl').onclick=()=>{const b=el('feedTray').querySelector('button:not(.eaten)');if(b)feed(Number(b.dataset.grain))};
el('feedBowl').ondragover=e=>e.preventDefault();
el('feedBowl').ondrop=e=>{e.preventDefault();const m=/^cat-food:([0-2])$/.exec(e.dataTransfer.getData('text/plain'));if(m)feed(Number(m[1]))};
el('reward').addEventListener('close',stopFeeding);
el('reward').addEventListener('cancel',()=>{stopFeeding();menu()});
</script></html>
