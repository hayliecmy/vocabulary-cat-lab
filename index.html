fill=\"none\" stroke=\"#5A4A42\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\n                    </g>\n                  </svg>"},{"word":"照料","items":[{"id":"new1_0","text":"照顧和料理，使人或動植物得到所需的關懷與照顧。","type":"def"},{"id":"new1_1","text":"通常有照顧的對象，例如病人、幼兒或花草；常與「細心」「悉心」配合使用。","type":"char"},{"id":"new1_2","text":"媽媽生病了，爸爸細心照料她，為她準備飯菜。","type":"ex"},{"id":"new1_3","text":"小晴每天替小兔餵食、換水，用心照料牠。","type":"ex"},{"id":"new1_4","text":"他養了小魚，卻長時間不餵食，也不理會魚缸的水質。","type":"nonex"},{"id":"new1_5","text":"小文只看了盆栽一眼便離開，沒有為乾枯的植物澆水。","type":"nonex"}],"svg":"<svg viewBox=\"0 0 160 140\" width=\"100%\" height=\"100%\">\n                    <g transform=\"translate(15, 20)\">\n                        <path d=\"M 20,80 Q 5,80 10,60\" fill=\"none\" stroke=\"#5A4A42\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n                        <path d=\"M 25,85 C 5,85 15,50 40,45 L 80,45 C 110,50 105,85 85,85 Z\" fill=\"#FADBD8\" stroke=\"#5A4A42\" stroke-width=\"5\" stroke-linejoin=\"round\"/>\n                        <circle cx=\"85\" cy=\"45\" r=\"26\" fill=\"#FADBD8\" stroke=\"#5A4A42\" stroke-width=\"5\"/>\n                        <polygon points=\"70,25 72,5 88,22\" fill=\"#FADBD8\" stroke=\"#5A4A42\" stroke-width=\"5\" stroke-linejoin=\"round\"/>\n                        <polygon points=\"100,25 98,5 82,22\" fill=\"#FADBD8\" stroke=\"#5A4A42\" stroke-width=\"5\" stroke-linejoin=\"round\"/>\n                        <circle cx=\"75\" cy=\"48\" r=\"2.5\" fill=\"#5A4A42\"/>\n                        <circle cx=\"95\" cy=\"48\" r=\"2.5\" fill=\"#5A4A42\"/>\n                        <path d=\"M 81,52 Q 85,56 85,52 Q 85,56 89,52\" fill=\"none\" stroke=\"#5A4A42\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\n                        <path d=\"M 72,18 L 98,18 L 93,5 L 77,5 Z\" fill=\"#FFFFFF\" stroke=\"#5A4A42\" stroke-width=\"4\" stroke-linejoin=\"round\"/>\n                        <path d=\"M 85,9 L 85,15 M 82,12 L 88,12\" stroke=\"#E74C3C\" stroke-width=\"2.5\"/>\n                        <rect x=\"105\" y=\"70\" width=\"25\" height=\"10\" fill=\"#FFFFFF\" stroke=\"#5A4A42\" stroke-width=\"3\" rx=\"2\" transform=\"rotate(-30 105 70)\"/>\n                        <rect x=\"98\" y=\"73\" width=\"8\" height=\"4\" fill=\"#5A4A42\" transform=\"rotate(-30 105 70)\"/>\n                    </g>\n                  </svg>"},{"word":"措手不及","items":[{"id":"new2_0","text":"事情突然發生，來不及準備或應付。","type":"def"},{"id":"new2_1","text":"常用「令……措手不及」或「被……弄得措手不及」；重點是事情突然而且來不及應對。","type":"char"},{"id":"new2_2","text":"突然下起大雨，沒有帶傘的我們措手不及，只好跑到簷下避雨。","type":"ex"},{"id":"new2_3","text":"表演途中音響突然失靈，令毫無準備的主持人措手不及。","type":"ex"},{"id":"new2_4","text":"小美早已準備好講稿，輪到她上台時，她從容地開始演講。","type":"nonex"},{"id":"new2_5","text":"大家事先排練過疏散程序，警報響起時便有條不紊地離開。","type":"nonex"}],"svg":"<svg viewBox=\"0 0 160 140\" width=\"100%\" height=\"100%\">\n                    <g transform=\"translate(15, 20)\">\n                        <circle cx=\"45\" cy=\"65\" r=\"11\" fill=\"#F4B8B8\" stroke=\"#5A4A42\" stroke-width=\"3\"/>\n                        <circle cx=\"95\" cy=\"65\" r=\"11\" fill=\"#9FC3D6\" stroke=\"#5A4A42\" stroke-width=\"3\"/>\n                        <rect x=\"35\" y=\"72\" width=\"70\" height=\"34\" fill=\"#EDBB99\" stroke=\"#5A4A42\" stroke-width=\"4.5\" stroke-linejoin=\"round\"/>\n                        <circle cx=\"70\" cy=\"56\" r=\"33\" fill=\"#F9E79F\" stroke=\"#5A4A42\" stroke-width=\"5\"/>\n                        <polygon points=\"44,34 38,15 58,28\" fill=\"#F9E79F\" stroke=\"#5A4A42\" stroke-width=\"4\" stroke-linejoin=\"round\"/>\n                        <polygon points=\"96,34 102,15 82,28\" fill=\"#F9E79F\" stroke=\"#5A4A42\" stroke-width=\"4\" stroke-linejoin=\"round\"/>\n                        <circle cx=\"58\" cy=\"54\" r=\"3\" fill=\"#5A4A42\"/>\n                        <circle cx=\"82\" cy=\"54\" r=\"3\" fill=\"#5A4A42\"/>\n                        <path d=\"M 66,60 Q 70,63 70,60 Q 70,63 74,60\" fill=\"none\" stroke=\"#5A4A42\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\ const app=document.querySelector('#app'),types=['def','char','ex','nonex'],labels=['定義','特徵','例子','非例子'],helps=['這個詞語是甚麼意思？','有甚麼重要性質或用法？','正確運用詞語的句子。','不符合詞義或用法的內容。'];let done=[];try{const d=JSON.parse(localStorage.getItem('vocab-lab-three-20261102'));if(Array.isArray(d))done=d.filter(n=>Number.isInteger(n)&&n>=0&&n<dataset.length)}catch{}let current=0,selected=null,places={},order=[],won=false;const el=id=>document.getElementById(id);function updateCount(){el('count').textContent=`${done.length}/${dataset.length}`}function menu(){updateCount();app.innerHTML=`<section class="hero"><div><div class="tag">詞義探索 · 迅速・照料・措手不及</div><h1>每個詞語，<br>都有值得探索的地方。</h1><p class="muted">跟小貓一起整理詞語卡片，探索定義、特徵與用法。<br>完成一個詞彙，就能收集一枚貓咪印章！</p><button class="primary" id="start">${done.length?'繼續探索':'開始探索'} →</button></div><div class="hero-art">${dataset[0].svg}<p>今天，一起學一個新詞語。</p></div></section><div class="row"><h2>選擇研究詞彙</h2><span class="muted">已完成 ${done.length} / ${dataset.length}</span></div><div class="progress"><span style="width:${done.length/dataset.length*100}%"></span></div><p class="muted">點選任何詞彙開始；已完成的詞彙也可以再次挑戰。</p><div class="grid">${dataset.map((d,i)=>`<button class="level" data-level="${i}"><small>研究 ${String(i+1).padStart(2,'0')}</small><strong>${d.word}</strong><small>${done.includes(i)?'✓ 已收集印章':'○ 等你來探索'} →</small></button>`).join('')}</div>`;el('start').onclick=()=>start(dataset.findIndex((_,i)=>!done.includes(i))<0?0:dataset.findIndex((_,i)=>!done.includes(i)));app.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start(+b.dataset.level))}
function start(i){current=i;places={};selected=null;won=false;order=[...dataset[i].items];for(let j=order.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[order[j],order[k]]=[order[k],order[j]]}renderGame()}
function renderGame(){const d=dataset[current];app.innerHTML=`<div class="row"><button id="menu">← 詞彙表</button><span class="tag">研究 ${current+1} / ${dataset.length}</span><button id="reset">重新排列</button></div><div class="row"><div><h1>${d.word}</h1><span class="muted">點選卡片，再按分類框的「放到這裏」。也可用滑鼠拖放。</span></div><button class="primary" id="check">檢查答案 ✓</button></div><div class="workspace"><aside class="pool" data-zone="pool"><h2>待分類卡片 <small id="remaining"></small></h2><button class="place" data-place="pool">放回待分類區 ↩</button><div class="pool-items" id="cards-pool"></div></aside><div class="board">${types.map((t,i)=>`<section class="zone" data-zone="${t}"><h3>${['📖','🔎','🌱','🧐'][i]} ${labels[i]}</h3><p>${helps[i]}</p><button class="place" data-place="${t}">放到這裏 ＋</button><div id="cards-${t}"></div></section>`).join('')}</div></div><div class="notice" id="notice" role="status" aria-live="polite">先讀一讀卡片，想想它屬於哪一類。</div><p><button id="hint">💡 分類提示</button></p>`;el('menu').onclick=menu;el('reset').onclick=()=>start(current);el('check').onclick=check;el('hint').onclick=()=>say('定義解釋意思；特徵說明性質或常見用法；例子展示正確運用；非例子包括錯誤用法或不符合詞義的內容。');app.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>move(b.dataset.place));app.querySelectorAll('[data-zone]').forEach(z=>{z.ondragover=e=>e.preventDefault();z.ondrop=e=>{e.preventDefault();const id=e.dataTransfer.getData('text/plain');if(order.some(x=>x.id===id)){selected=id;move(z.dataset.zone)}}});cards()}
function say(s){el('notice').textContent=s}function cards(){['pool',...types].forEach(t=>el('cards-'+t).replaceChildren());for(const item of order){const b=document.createElement('button');b.className='card'+(selected===item.id?' selected':'');b.textContent=item.text;b.dataset.id=item.id;b.setAttribute('aria-pressed',selected===item.id);b.draggable=true;b.onclick=()=>{selected=selected===item.id?null:item.id;cards();if(selected){app.querySelector(`[data-id="${selected}"]`).focus();say('已選取卡片，請選擇放置位置。')}};b.ondragstart=e=>{selected=item.id;e.dataTransfer.setData('text/plain',item.id)};el('cards-'+(places[item.id]||'pool')).append(b)}el('remaining').textContent=order.filter(x=>!places[x.id]).length+'/6'}function move(t){if(!selected){say('請先點選一張卡片。');return}if(t==='pool')delete places[selected];else places[selected]=t;selected=null;cards();say('已移動卡片。完成分類後，按「檢查答案」。')}
function check(){const missing=order.filter(x=>!places[x.id]).length;if(missing){say(`還有 ${missing} 張卡片未分類，試試把它們放到四個分類框。`);return}let errors=0;app.querySelectorAll('.card').forEach(b=>{const item=order.find(x=>x.id===b.dataset.id),correct=places[item.id]===item.type;b.classList.toggle('wrong',!correct);b.classList.toggle('right',correct);b.setAttribute('aria-label',`${correct?'分類正確':'請再想想'}：${item.text}`);if(!correct)errors++});if(errors){say(`有 ${errors} 張卡片需要再想想（紅框）。點選卡片後可以移到另一格。`);return}say('全部正確！你已掌握這個詞彙的四個面向。');if(!done.includes(current)){done.push(current);try{localStorage.setItem('vocab-lab-three-20261102',JSON.stringify(done))}catch{}}updateCount();if(!won){won=true;el('rewardArt').innerHTML=dataset[current].svg;el('next').textContent=current===dataset.length-1?'查看印章冊 →':'下一個詞彙 →';el('reward').showModal()}}
function album(){app.innerHTML=`<div class="row"><h1>我的貓咪印章冊</h1><button id="home">← 詞彙表</button></div><p class="muted">已收集 ${done.length} / ${dataset.length} 枚。每一枚都是認真思考的足印。</p><div class="grid">${dataset.map((d,i)=>`<div class="stamp">${done.includes(i)?d.svg:'<div style="height:130px;display:grid;place-items:center;font-size:50px" aria-label="尚未解鎖">🔒</div>'}<h2>${d.word}</h2><button data-level="${i}">${done.includes(i)?'再次挑戰':'前往探索'}</button></div>`).join('')}</div>`;el('home').onclick=menu;app.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start(+b.dataset.level))}el('album').onclick=album;el('back').onclick=()=>{el('reward').close();menu()};el('next').onclick=()=>{el('reward').close();if(current===dataset.length-1)album();else start(current+1)};menu();
</script></html>
